<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diag ProspectaX</title><style>body{font-family:Arial,sans-serif;background:#0f2a4a;color:#10213b;margin:0;padding:18px}.box{background:#fff;border-radius:14px;padding:18px;max-width:720px;margin:auto}h1{font-size:20px;margin:0 0 8px}.row{border:1px solid #dce4ef;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}.ok{border-color:#4caf50}.bad{border-color:#e8541a}.muted{color:#667;font-size:12px}button{background:#e8541a;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}pre{white-space:pre-wrap;background:#f5f7fb;padding:10px;border-radius:10px;font-size:12px}</style></head><body><div class="box"><h1>Diagnostico ProspectaX</h1><p class="muted">Abra esta pagina pelo mesmo link online no celular. Ela mede os tempos reais desse aparelho.</p><button onclick="run()">Rodar teste</button><div id="out"></div><pre id="copy"></pre></div><script>
const tests=[['health','/api/health'],['login','/login'],['css','/login.css'],['js','/login.js'],['me','/api/me'],['prefs','/api/user-prefs'],['status','/api/contact-status'],['notes','/api/notes'],['history','/api/history'],['home','/']];
function add(name,status,ms,len,extra){const d=document.createElement('div');d.className='row '+(status<400?'ok':'bad');d.textContent=`${name}: ${status} - ${ms}ms - ${len} bytes ${extra||''}`;out.appendChild(d);return {name,status,ms,len,extra:extra||''}}
async function one(name,url){const t=performance.now();try{const r=await fetch(url+(url.includes('?')?'&':'?')+'diag='+Date.now(),{cache:'no-store'});const tx=await r.text();return add(name,r.status,Math.round(performance.now()-t),tx.length,r.redirected?'redirected':'')}catch(e){return add(name,999,Math.round(performance.now()-t),0,e.message)}}
async function run(){out.innerHTML='';copy.textContent='Rodando...';const started=new Date().toISOString();const ua=navigator.userAgent;const rows=[];for(const t of tests)rows.push(await one(t[0],t[1]));copy.textContent=JSON.stringify({started,ua,href:location.href,rows},null,2)}
run();</script></body></html>
